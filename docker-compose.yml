services:
  agentui:
    build: .
    image: openkg/agentui:latest
    ports:
      - "${SVR_WEB_HTTP_PORT:-80}:80"
    environment:
      - INTELLECT_HOST=intellect
      - PYTHON_API_PORT=9380
      - PYTHON_ADMIN_PORT=9381
      - BFF_PORT=9390
    depends_on:
      - intellect
    restart: unless-stopped

  intellect:
    image: ontoweb/intellect:latest
    ports:
      - "${SVR_HTTP_PORT:-9380}:9380"
      - "${ADMIN_SVR_HTTP_PORT:-9381}:9381"
      - "${SVR_MCP_PORT:-9382}:9382"
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - ES_HOST=elasticsearch
      - MINIO_HOST=minio
    env_file: .env
    depends_on:
      - mysql
      - elasticsearch
      - redis
      - minio
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-ontoweb_intellect}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-intellect}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-intellect}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-ontoweb_intellect0}
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  es_data:
  redis_data:
  minio_data:
