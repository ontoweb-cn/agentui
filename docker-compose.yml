services:
  agentui:
    build: .
    image: intellect/agentui:latest
    ports:
      - "${SVR_WEB_HTTP_PORT:-80}:80"
    environment:
      - INTELLECT_RAG_HOST=intellect-rag
      - PYTHON_API_PORT=9380
      - PYTHON_ADMIN_PORT=9381
      - INTELLECT_RAG_URL=http://intellect-rag:9380
      - BFF_PORT=9390
      # cognitive-wargame 管理服务地址(nginx REST 通道 + BFF 插件代理 override)。
      # wargamesrv 与本 compose 同网络时用服务名(如 wargamesrv);
      # 独立部署时用宿主地址(host.docker.internal / 172.17.0.1 / 实际 IP)。
      - WARGAME_HOST=${WARGAME_HOST:-host.docker.internal}
      - WARGAME_PORT=9385
      # 运行时插件(#2b):镜像内置 bundle 的安装 token(entrypoint 用),
      # 生产必须换成强随机值;override 使插件代理指向实际 wargamesrv。
      - BFF_PLUGIN_INSTALL_TOKEN=${BFF_PLUGIN_INSTALL_TOKEN:?须设置插件安装 token(强随机值)}
      - BFF_PLUGIN_BACKEND_OVERRIDES=cognitive-wargame=http://${WARGAME_HOST:-host.docker.internal}:${WARGAME_PORT:-9385}
    depends_on:
      - intellect-rag
    restart: unless-stopped

  intellect-rag:
    image: ontoweb/intellect-rag:latest
    ports:
      - "${SVR_HTTP_PORT:-9380}:9380"
      - "${ADMIN_SVR_HTTP_PORT:-9381}:9381"
      - "${SVR_MCP_PORT:-9382}:9382"
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - ES_HOST=elasticsearch
      - MINIO_HOST=minio
    env_file: .env
    depends_on:
      - mysql
      - elasticsearch
      - redis
      - minio
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "5455:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-ontoweb_intellect_rag}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-intellect_rag}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    ports:
      - "1200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ontoweb_intellect_rag
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-intellect_rag}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-ontoweb_intellect_rag0}
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  es_data:
  redis_data:
  minio_data:
