# 外部网关片段 — AgentUI 挂在 ai.wust.edu.cn 根路径（拓扑：根路径 /）
#
# 用法：把下面 location / 合并进现有 ai.wust.edu.cn 的 443 server{} 中，
# 并删除原有的 `location = / { return 301 /frontend/; }`。
# 其他更具体的 location（/frontend/、/auth/、/intellect-gateway、/intellect-kb、
# /wargame/ 等）优先级更高，保持不动。
# <cluster-node-ip> 替换为任一 k8s 节点内网 IP；Service 固定 NodePort 31390。

    # AgentUI 根路径（放在 server{} 内）
    location / {
        proxy_pass http://<cluster-node-ip>:31390;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长连接：关闭缓冲并放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 大附件/画布导入（如 server{} 已有更严格配置，以网关为准）
    client_max_body_size 1024m;
