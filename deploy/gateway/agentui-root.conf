# 外部网关片段 — AgentUI 挂在 ai.wust.edu.cn 根路径（拓扑：根路径 /）
#
# 用法：把下面内容合并进现有 ai.wust.edu.cn 的 443 server{} 中。
# 需要删除：
#   1) 原有 `location = / { return 301 /frontend/; }`
#   2) 原有 `/frontend/` 相关 location（旧门户入口下线）
#
# ⚠️ 不要删除 /portal*：现行 HIEDU Portal 挂在
#   /portal（hiedu-portal:80）、/portal-api 与 /portal-oauth2（hiedu-oauth2-proxy:4180）。
# 若只保留 location / → AgentUI，这三条会被 AgentUI 的 SPA 回退吞掉，
# 表现为 /portal 返回 AgentUI 的 index.html（200），Portal 静默不可用。
# 2026-11-21 线上故障即此原因。
#
# 其他更具体的 location（/auth/、/intellect-gateway、/intellect-kb、
# /wargame/、/portal*）优先级高于 location /，保持不变。
# <cluster-node-ip> 替换为任一 k8s 节点内网 IP；AgentUI Service 固定 NodePort 31390。
# <ingress-nginx-http-nodeport> 替换为 ingress-nginx Controller 的 HTTP NodePort。

    # ---------------------------------------------------------------------
    # HIEDU Portal（必须放在 location / 之前；交给 ingress-nginx）
    # Host 必须保持 ai.wust.edu.cn；proxy_pass 不能带 URI，否则前缀会被改写。
    # ---------------------------------------------------------------------
    location ^~ /portal-oauth2/ {
        proxy_pass http://<ingress-nginx-http-nodeport>;
        proxy_set_header Host ai.wust.edu.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /portal-api/ {
        proxy_pass http://<ingress-nginx-http-nodeport>;
        proxy_set_header Host ai.wust.edu.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /portal/ {
        proxy_pass http://<ingress-nginx-http-nodeport>;
        proxy_set_header Host ai.wust.edu.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # AgentUI 根路径（放在 server{} 内）
    location / {
        proxy_pass http://<cluster-node-ip>:31390;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长连接：关闭缓冲并放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 大附件/画布导入（如 server{} 已有更严格配置，以网关为准）
    client_max_body_size 1024m;
