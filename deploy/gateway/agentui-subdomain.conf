# 外部网关片段 — AgentUI 独立子域（拓扑 B）
#
# 由 ai.wust.edu.cn 所在的外部 nginx 引用（集群外，CI 无权限）。
# 将 <cluster-node-ip> 替换为任一 k8s 节点内网 IP；Service 已固定 NodePort 31390。
# TLS 证书路径按网关实际填写；SSE 必须关闭缓冲。

server {
    listen 80;
    server_name agentui.wust.edu.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agentui.wust.edu.cn;

    ssl_certificate     /etc/nginx/ssl/agentui.wust.edu.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/agentui.wust.edu.cn.key;

    # 大附件/画布导入
    client_max_body_size 1024m;

    location / {
        proxy_pass http://<cluster-node-ip>:31390;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长连接：禁用缓冲并放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查（可选，便于网关侧探活）
    location = /healthz {
        proxy_pass http://<cluster-node-ip>:31390/api/bff/health;
        access_log off;
    }
}
