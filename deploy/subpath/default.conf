# =============================================================================
# 子目录部署 Nginx 配置(方案 A)
#
# 前端在 /${SUBPATH}/,API 走根路径 /api/*
#     /agentui/             → SPA(/usr/share/nginx/html/agentui/)
#     /api/bff/             → BFF(Node,127.0.0.1:${BFF_PORT})
#     /api/v1/wargame/      → cognitive-wargame 服务(SSE 友好)
#     /api/v1/admin         → intellect-rag admin
#     ^/(v1|api)            → intellect-rag API(catch-all)
#
# 环境变量(envsubst 注入,见 docker-entrypoint.sh):
#   SUBPATH               前端子目录名(如 agentui,无前后斜杠)
#   BFF_PORT              BFF 端口
#   INTELLECT_RAG_HOST    intellect-rag 主机
#   PYTHON_API_PORT       intellect-rag API 端口(默认 9380)
#   PYTHON_ADMIN_PORT     intellect-rag admin 端口(默认 9381)
#   WARGAME_HOST          cognitive-wargame 主机
#   WARGAME_PORT          cognitive-wargame 端口(默认 9385)
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # -------------------------------------------------------------------------
    # 前端 SPA(子目录)
    # -------------------------------------------------------------------------
    location /${SUBPATH}/ {
        alias /usr/share/nginx/html/${SUBPATH}/;
        index index.html;
        try_files $uri $uri/ /${SUBPATH}/index.html;
    }

    # 无尾斜杠访问 /${SUBPATH} → 301 到 /${SUBPATH}/,确保相对路径正确
    location = /${SUBPATH} {
        return 301 /${SUBPATH}/;
    }

    # -------------------------------------------------------------------------
    # API 路由(根路径,与前端子目录解耦)
    # -------------------------------------------------------------------------
    # BFF 路由 → 本地 Node 进程
    # 去掉 /api/bff/ 前缀(与 vite.config.ts 的 rewrite 一致)
    location /api/bff/ {
        rewrite ^/api/bff/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:${BFF_PORT};
        include /etc/nginx/proxy.conf;
    }

    # cognitive-wargame 管理服务(SSE 友好)
    # 注意:必须放在 ^/(v1|api) catch-all 之前
    location /api/v1/wargame/ {
        proxy_pass http://${WARGAME_HOST}:${WARGAME_PORT};
        include /etc/nginx/proxy.conf;
        # SSE 长连接:禁用缓冲,关闭超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 0;
        proxy_send_timeout 0;
        # SSE 事件流需保留 Connection: keep-alive
        proxy_set_header Connection "keep-alive";
    }

    # Admin API → intellect-rag Python admin
    location ~ ^/api/v1/admin {
        proxy_pass http://${INTELLECT_RAG_HOST}:${PYTHON_ADMIN_PORT};
        include /etc/nginx/proxy.conf;
    }

    # 其余 API → intellect-rag Python API
    location ~ ^/(v1|api) {
        proxy_pass http://${INTELLECT_RAG_HOST}:${PYTHON_API_PORT};
        include /etc/nginx/proxy.conf;
    }

    # -------------------------------------------------------------------------
    # 静态资源缓存(Vite 构建产物在 ${SUBPATH}/assets/ 下)
    # -------------------------------------------------------------------------
    location ~ ^/${SUBPATH}/assets/ {
        expires 10y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 根路径 / 直接 301 到子目录(可选,避免用户访问根路径 404)
    location = / {
        return 301 /${SUBPATH}/;
    }
}
