# agentui k8s 部署(#2b 部署形态)
# 用法见同目录 README.md;按环境替换 <项目>/<tag>/<namespace> 与后端地址。
# 2026-10-14 实际部署记录见 cluster-rollout.md §5:intellect ns、NodePort 31390、
# 0.4.0 镜像需用 host:port env(WARGAME_HOST/INTELLECT_RAG_HOST,集群内 Service),
# 本文件的 *_UPSTREAM 全 URL 形式自 ≥0.4.1 镜像(dev 分支模板)起生效;
# 私有镜像需 imagePullSecrets(见 §5.1 踩坑 1)。
apiVersion: v1
kind: Service
metadata:
  name: agentui
  labels:
    app: agentui
spec:
  # 与线上保持一致的固定 NodePort（31390）；ArgoCD 同步不会再把类型回滚成 ClusterIP
  type: NodePort
  selector:
    app: agentui
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31390
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentui
  labels:
    app: agentui
spec:
  replicas: 1
  # RWO PVC 不能跨节点多挂载，滚动更新会卡在 Multi-Attach；用 Recreate 先停旧 Pod
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentui
  template:
    metadata:
      labels:
        app: agentui
      annotations:
        # 变更 ConfigMap 环境变量后用于触发滚动重启（更新该时间戳即可）
        kubectl.kubernetes.io/restartedAt: "2026-11-21T01:30:00Z"
    spec:
      # 私有 Harbor 必须带拉取凭证（Secret 创建命令见 README §3）
      imagePullSecrets:
        - name: agentui-pull-secret
      containers:
        - name: agentui
          # 内网制品库 hub.wust.edu.cn;tag 与插件 bundle 版本一一对应
          image: hub.wust.edu.cn/intellect/agentui:0.4.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          # 非敏感 SSO/站点配置（见 agentui-config.yaml）
          envFrom:
            - configMapRef:
                name: agentui-config
          env:
            # 网关化拓扑(2026-10-14 决策):三后端经 ai.wust.edu.cn 公网网关访问,
            # 集群需放行 egress 443(前提核验见 deploy/cluster-rollout.md)
            # intellect-rag(Python API/admin):https + 路径,经 RAG_*_UPSTREAM 注入
            - name: RAG_API_UPSTREAM
              value: https://ai.wust.edu.cn/intellect-kb
            - name: RAG_ADMIN_UPSTREAM
              value: https://ai.wust.edu.cn/intellect-kb
            # cognitive-wargame:wargamesrv 网关化到 /wargame(网关剥前缀前提,
            # 见 cluster-rollout.md §0.2);REST 通道(nginx)与 BFF 插件代理共用
            - name: WARGAME_UPSTREAM
              value: https://ai.wust.edu.cn/wargame/
            # 运行时插件(#2b):install 时覆盖 app.json 里的 backend.target,
            # 指向网关化 wargamesrv(宽松级校验允许 https 域名)
            - name: BFF_PLUGIN_BACKEND_OVERRIDES
              value: cognitive-wargame=https://ai.wust.edu.cn/wargame
            - name: BFF_PORT
              value: '9390'
            # 统一认证能力：默认关闭；试点验证后改为 'true'，并完成 hiedu 断言密钥 Secret。
            - name: INTELLECT_AUTH_ENABLED
              value: 'false'
            # hiedu 断言代理（BFF → hiedu API）；ISS/AUD/ORG 缺省为 gateway/hiedu/wust。
            - name: HIEDU_AUTH_MODE
              value: 'gateway'
            - name: HIEDU_BASE_URL
              value: 'http://hiedu:8099'
            # 组织编码须与 hiedu 侧 HIEDU_ORG_CODE 一致（缺省 wust）。
            - name: HIEDU_ORG_CODE
              value: 'wust'
            # kid + Ed25519 私钥（PKCS#8 PEM）从 Secret 注入。
            - name: HIEDU_BFF_ASSERT_KID
              valueFrom:
                secretKeyRef:
                  name: agentui-hiedu-assertion
                  key: kid
                  optional: true
            - name: HIEDU_BFF_ASSERT_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: agentui-hiedu-assertion
                  key: private-key-pem
                  optional: true
            # 插件安装 token 从 Secret 注入(见 README 创建命令)
            - name: BFF_PLUGIN_INSTALL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentui-plugin-admin
                  key: token
            # SSO state Cookie 签名密钥（启用 SSO 前必须创建 agentui-sso Secret）
            - name: BFF_SSO_STATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentui-sso
                  key: state-secret
                  optional: true
          volumeMounts:
            # 生产运行 dist/index.mjs，数据目录解析为 /app/data（不是 /app/bff/data）
            - name: agentui-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/bff/plugins
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: agentui-data
          persistentVolumeClaim:
            claimName: agentui-data
