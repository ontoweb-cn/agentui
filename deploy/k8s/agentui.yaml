# agentui k8s 部署(#2b 部署形态)
# 用法见同目录 README.md;按环境替换 <项目>/<tag>/<namespace> 与后端地址。
apiVersion: v1
kind: Service
metadata:
  name: agentui
  labels:
    app: agentui
spec:
  selector:
    app: agentui
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentui
  labels:
    app: agentui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentui
  template:
    metadata:
      labels:
        app: agentui
    spec:
      containers:
        - name: agentui
          # 内网制品库 hub.wust.edu.cn;tag 与插件 bundle 版本一一对应
          image: hub.wust.edu.cn/intellect/agentui:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            # 网关化拓扑(2026-10-14 决策):三后端经 ai.wust.edu.cn 公网网关访问,
            # 集群需放行 egress 443(前提核验见 deploy/cluster-rollout.md)
            # intellect-rag(Python API/admin):https + 路径,经 RAG_*_UPSTREAM 注入
            - name: RAG_API_UPSTREAM
              value: https://ai.wust.edu.cn/intellect-kb
            - name: RAG_ADMIN_UPSTREAM
              value: https://ai.wust.edu.cn/intellect-kb
            # cognitive-wargame:wargamesrv 网关化到 /wargame(网关剥前缀前提,
            # 见 cluster-rollout.md §0.2);REST 通道(nginx)与 BFF 插件代理共用
            - name: WARGAME_UPSTREAM
              value: https://ai.wust.edu.cn/wargame/
            # 运行时插件(#2b):install 时覆盖 app.json 里的 backend.target,
            # 指向网关化 wargamesrv(宽松级校验允许 https 域名)
            - name: BFF_PLUGIN_BACKEND_OVERRIDES
              value: cognitive-wargame=https://ai.wust.edu.cn/wargame
            - name: BFF_PORT
              value: '9390'
            # 插件安装 token 从 Secret 注入(见 README 创建命令)
            - name: BFF_PLUGIN_INSTALL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentui-plugin-admin
                  key: token
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/bff/plugins
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      # 镜像来自内网制品库时按需配置拉取凭证:
      # imagePullSecrets:
      #   - name: hub-wust-pull-secret
