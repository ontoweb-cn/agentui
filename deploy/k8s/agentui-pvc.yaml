# bff/data 持久化（后端/租户配置、token vault key、插件安装数据）
# 说明：首次接入 PVC 时，旧 Pod 临时盘中的数据不会自动迁移，
#       需重新执行 /admin/wizard 或从旧 Pod 拷贝 bff/data。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentui-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # 与集群现有应用一致（hiedu/intellect-team 均使用 nfs-csi）
  storageClassName: nfs-csi
