# AgentUI 非敏感运行时配置（由 Deployment envFrom 注入）
# 拓扑：ai.wust.edu.cn 根路径（原 /frontend 门户下线，不再保留）
# 启用 SSO：在「系统管理 → 统一认证设置」开启（运行时 sso-config.json，保存即时生效），
# 无需部署 env 开关；网关侧需先配置 provider 与回调白名单。
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentui-config
data:
  BFF_PUBLIC_ORIGIN: "https://ai.wust.edu.cn"
  BFF_FRONTEND_BASE: ""
  BFF_SSO_PROVIDERS: ""
  BFF_SSO_EXCHANGE_TIMEOUT_MS: "10000"
  BFF_SSO_PROVIDER_CACHE_MS: "30000"
  BFF_OAUTH_FRONTEND_HOME: "/"
  CORS_ALLOWED_ORIGINS: "https://ai.wust.edu.cn"
