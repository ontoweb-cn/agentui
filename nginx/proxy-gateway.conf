# 网关化上游专用代理参数(与 proxy.conf 的唯一差异:Host 头)。
# 背景(评审 P1):proxy.conf 的 proxy_set_header Host $host 会把入站请求的
# Host(集群里是 NodePort/LB 地址)透传给上游;原拓扑上游为无 vhost 的
# host:port 服务无实害,但网关化后上游 ai.wust.edu.cn 按 Host 选虚拟主机,
# 失配即 404/默认站。$proxy_host = proxy_pass 的主机名 = 网关期望的 Host。
# 默认 host:port 上游时 Host 值变为上游地址——python/wargamesrv 不校验 Host。
proxy_set_header Host $proxy_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# https 上游:SNI 与 TLS 版本显式化
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffer_size 1024k;
proxy_buffers 16 1024k;
proxy_busy_buffers_size 2048k;
proxy_temp_file_write_size 2048k;
