server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # BFF 路由 → 本地 Node 进程
    # Strip the /api/bff/ prefix (mirrors Vite's `rewrite` in vite.config.ts)
    # before forwarding. nginx disables automatic URI rewriting when the
    # proxy_pass target contains a variable, so rewrite explicitly and pass
    # the bare upstream URL.
    location /api/bff/ {
        rewrite ^/api/bff/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:${BFF_PORT};
        include /etc/nginx/proxy.conf;
    }

    # Admin API → intellect-rag Python admin
    location ~ ^/api/v1/admin {
        proxy_pass http://${INTELLECT_RAG_HOST}:${PYTHON_ADMIN_PORT};
        include /etc/nginx/proxy.conf;
    }

    # cognitive-wargame 管理服务（SSE 友好，须放在 catch-all 之前）
    location /api/v1/wargame/ {
        proxy_pass http://${WARGAME_HOST}:${WARGAME_PORT}/api/v1/;
        include /etc/nginx/proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 0;
        proxy_send_timeout 0;
        proxy_set_header Connection "keep-alive";
    }

    # 其余 API → intellect-rag Python API
    location ~ ^/(v1|api) {
        proxy_pass http://${INTELLECT_RAG_HOST}:${PYTHON_API_PORT};
        include /etc/nginx/proxy.conf;
    }

    # SPA 回退
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Cache-Control: max-age Expires
    location ~ ^/static/(css|js|media)/ {
        expires 10y;
        access_log off;
    }
}
